name: Refresh optionintel data

# Runs the wheel engine (Tradier) and commits a fresh site/data/signals.json.
# Cloudflare Pages (connected to this repo) auto-deploys on the push.
on:
  push:
    branches: [main]
    paths:                          # refresh on any change to the engine/data pipeline
      - "signals.py"
      - "build_json.py"
      - "tradier.py"
      - "sheets.py"
      - "wheel_universe.json"
      - ".github/workflows/refresh-optionintel.yml"
  schedule:
    - cron: "*/30 13-21 * * 1-5"   # every 30 min, ~US market hours (UTC), Mon–Fri
  workflow_dispatch: {}             # manual "Run workflow" button

permissions:
  contents: write                   # allow the bot to push the refreshed JSON

concurrency:
  group: optionintel-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      TRADIER_ENV:   ${{ secrets.TRADIER_ENV }}
      # Lets the scan fold registered users' private watchlist tickers in (build_json._user_tickers).
      # Absent → the read no-ops and only the default watchlist is scanned; the build never breaks.
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine deps
        run: pip install requests yfinance

      - name: Run engine → JSON
        run: python build_json.py

      - name: Commit fresh data (only if it changed)
        run: |
          if git diff --quiet -- site/data/signals.json; then
            echo "No change — skipping commit."
          else
            git config user.name  "optionintel-bot"
            git config user.email "optionintel-bot@users.noreply.github.com"
            git add site/data/signals.json
            # NOTE: no "[skip ci]" — Cloudflare Pages SKIPS commits with that marker, which was
            # silently stopping every data refresh from deploying to optionintel.app (the site only
            # updated on code pushes). No GitHub workflow triggers on the site/data path, so a plain
            # commit here causes no Actions loop — it just lets Cloudflare publish the fresh data.
            git commit -m "data: refresh signals"
            # Race-safe push: a code-push-triggered refresh and the 30-min cron can overlap, so
            # another run may land first. On rejection, rebase our data commit onto the latest
            # main (favouring our freshly-generated file) and retry, instead of failing the run.
            pushed=0
            for i in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "push rejected — rebasing on latest origin/main (attempt $i)"
              git fetch origin main
              git rebase -X theirs origin/main || git rebase --abort
              sleep $((i * 3))
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::could not push refreshed data after 5 attempts"; exit 1
            fi
          fi
