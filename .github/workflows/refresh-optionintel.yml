name: Refresh optionintel data

# Runs the wheel engine (Tradier) and commits a fresh site/data/signals.json.
# Cloudflare Pages (connected to this repo) auto-deploys on the push.
on:
  push:
    branches: [main]
    paths:                          # refresh on any change to the engine/data pipeline
      - "signals.py"
      - "build_json.py"
      - "tradier.py"
      - "sheets.py"
      - "wheel_universe.json"
      - ".github/workflows/refresh-optionintel.yml"
  schedule:
    # Best-effort FALLBACK only. GitHub throttles/skips high-frequency cron, so this alone does NOT
    # give a dependable 30-min heartbeat — an external scheduler (Cloudflare Worker / cron-job.org)
    # dispatches this workflow reliably. The band 12–22 UTC covers 08:30–17:00 ET in BOTH EDT and
    # EST; the ET gate below is the single source of truth that keeps every run inside the real window.
    # Runs every day (incl. weekends) so BTC/ETH quotes and the data-pull stamp stay current when
    # crypto trades 24/7 — stock/options data simply re-shows Friday's close while markets are shut.
    - cron: "*/10 8-23 * * 1-5"   # backup trigger, ~every 10 min on weekdays; the DST-aware ET gate
                                  # below is the real bound (04:00–20:00 ET). The Cloudflare Worker
                                  # is the PRIMARY, reliable 10-min trigger — this cron is a fallback.
  workflow_dispatch:                # manual / external dispatch
    inputs:
      force:
        description: "Run even outside the ET market window"
        type: boolean
        default: false

permissions:
  contents: write                   # allow the bot to push the refreshed JSON

concurrency:
  group: optionintel-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      TRADIER_ENV:   ${{ secrets.TRADIER_ENV }}
      # Lets the scan fold registered users' private watchlist tickers in (build_json._user_tickers).
      # Absent → the read no-ops and only the default watchlist is scanned; the build never breaks.
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Single source of truth for WHEN the heartbeat runs: every ~10 min, 04:00–20:00 ET
      # (premarket → post-market), Mon–Fri only. Uses America/New_York, so it tracks EDT/EST
      # automatically. A code push always runs (fresh deploy); a manual dispatch can force off-window.
      - id: gate
        name: Gate to the ET market window (DST-aware)
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          ev   = os.environ.get("EVENT", "")
          force= (os.environ.get("FORCE") or "").lower() == "true"
          now  = datetime.now(ZoneInfo("America/New_York"))
          mins     = now.hour * 60 + now.minute
          in_window= (now.weekday() < 5) and (4*60) <= mins <= (20*60)   # 04:00–20:00 ET, Mon–Fri (pre→post-market)
          go = (ev == "push") or force or in_window
          print(f"{now:%a %Y-%m-%d %H:%M} ET | in_window={in_window} "
                f"event={ev} force={force} -> go={go}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"go={'true' if go else 'false'}\n")
          PY

      - name: Install engine deps
        if: steps.gate.outputs.go == 'true'
        run: pip install requests yfinance

      - name: Run engine → JSON
        if: steps.gate.outputs.go == 'true'
        run: python build_json.py

      - name: Publish data to the `data` branch (served to the site; keeps main small)
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name  "optionintel-bot"
          git config user.email "optionintel-bot@users.noreply.github.com"
          # Publish signals.json as a ONE-FILE, PARENT-LESS commit forced onto the `data` branch.
          # No parent → the branch never accumulates history (old blobs get GC'd), so even a 10-min
          # cadence never bloats the repo. Cloudflare Pages watches `main`, so this NEVER triggers a
          # site rebuild — data refresh is fully decoupled from the 500-build/month cap. The page
          # fetches this file from raw.githubusercontent (…/data/signals.json) and falls back to the
          # copy bundled in the last deploy if GitHub raw is briefly unreachable.
          blob=$(git hash-object -w site/data/signals.json)
          tree=$(printf '100644 blob %s\tsignals.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "data refresh $(date -u +%FT%TZ)")
          git push --force origin "$commit:refs/heads/data"
          echo "Published → https://raw.githubusercontent.com/cybercurry/options-dashboard/data/signals.json"
