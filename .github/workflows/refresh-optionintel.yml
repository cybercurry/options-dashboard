name: Refresh optionintel data

# Runs the wheel engine (Tradier) and commits a fresh site/data/signals.json.
# Cloudflare Pages (connected to this repo) auto-deploys on the push.
on:
  push:
    branches: [main]
    paths:                          # refresh on any change to the engine/data pipeline
      - "signals.py"
      - "build_json.py"
      - "tradier.py"
      - "sheets.py"
      - "wheel_universe.json"
      - ".github/workflows/refresh-optionintel.yml"
  schedule:
    # Best-effort FALLBACK only. GitHub throttles/skips high-frequency cron, so this alone does NOT
    # give a dependable 30-min heartbeat — an external scheduler (Cloudflare Worker / cron-job.org)
    # dispatches this workflow reliably. The band 12–22 UTC covers 08:30–17:00 ET in BOTH EDT and
    # EST; the ET gate below is the single source of truth that keeps every run inside the real window.
    - cron: "*/30 12-22 * * 1-5"
  workflow_dispatch:                # manual / external dispatch
    inputs:
      force:
        description: "Run even outside the ET market window"
        type: boolean
        default: false

permissions:
  contents: write                   # allow the bot to push the refreshed JSON

concurrency:
  group: optionintel-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      TRADIER_ENV:   ${{ secrets.TRADIER_ENV }}
      # Lets the scan fold registered users' private watchlist tickers in (build_json._user_tickers).
      # Absent → the read no-ops and only the default watchlist is scanned; the build never breaks.
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Single source of truth for WHEN the heartbeat runs: every 30 min, 08:30–17:00 ET
      # (market open −1h … close +1h), Mon–Fri. Uses the America/New_York tz, so it tracks EDT/EST
      # automatically. A code push always runs (fresh deploy); a manual dispatch can force off-window.
      - id: gate
        name: Gate to the ET market window (DST-aware)
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          ev   = os.environ.get("EVENT", "")
          force= (os.environ.get("FORCE") or "").lower() == "true"
          now  = datetime.now(ZoneInfo("America/New_York"))
          weekday  = now.weekday() < 5                 # Mon–Fri
          mins     = now.hour * 60 + now.minute
          in_window= (8*60 + 30) <= mins <= (17*60)    # 08:30 … 17:00 ET
          go = (ev == "push") or force or (weekday and in_window)
          print(f"{now:%a %Y-%m-%d %H:%M} ET | weekday={weekday} in_window={in_window} "
                f"event={ev} force={force} -> go={go}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"go={'true' if go else 'false'}\n")
          PY

      - name: Install engine deps
        if: steps.gate.outputs.go == 'true'
        run: pip install requests yfinance

      - name: Run engine → JSON
        if: steps.gate.outputs.go == 'true'
        run: python build_json.py

      - name: Commit fresh data (only if it changed)
        if: steps.gate.outputs.go == 'true'
        run: |
          if git diff --quiet -- site/data/signals.json; then
            echo "No change — skipping commit."
          else
            git config user.name  "optionintel-bot"
            git config user.email "optionintel-bot@users.noreply.github.com"
            git add site/data/signals.json
            # NOTE: no "[skip ci]" — Cloudflare Pages SKIPS commits with that marker, which was
            # silently stopping every data refresh from deploying to optionintel.app (the site only
            # updated on code pushes). No GitHub workflow triggers on the site/data path, so a plain
            # commit here causes no Actions loop — it just lets Cloudflare publish the fresh data.
            git commit -m "data: refresh signals"
            # Race-safe push: a code-push-triggered refresh and the 30-min cron can overlap, so
            # another run may land first. On rejection, rebase our data commit onto the latest
            # main (favouring our freshly-generated file) and retry, instead of failing the run.
            pushed=0
            for i in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "push rejected — rebasing on latest origin/main (attempt $i)"
              git fetch origin main
              git rebase -X theirs origin/main || git rebase --abort
              sleep $((i * 3))
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::could not push refreshed data after 5 attempts"; exit 1
            fi
          fi
