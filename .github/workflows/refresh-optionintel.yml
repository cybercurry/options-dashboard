name: Refresh optionintel data

# Runs the wheel engine (Tradier) and commits a fresh site/data/signals.json.
# Cloudflare Pages (connected to this repo) auto-deploys on the push.
on:
  push:
    branches: [main]
    paths:                          # refresh on any change to the engine/data pipeline
      - "signals.py"
      - "build_json.py"
      - "tradier.py"
      - "sheets.py"
      - "wheel_universe.json"
      - ".github/workflows/refresh-optionintel.yml"
  # NO GitHub `schedule:` — GitHub's free cron throttles/skips runs badly (it fired once in ~4h
  # overnight), so it is NOT used. The heartbeat is driven SOLELY by an external scheduler
  # (cron-job.org) hitting workflow_dispatch below, every 10 min, 24/7. The DST-aware ET gate then
  # routes each fire: weekday 04:00–20:00 ET → full Tradier scan; everything else → light tiles-only.
  workflow_dispatch:                # external dispatch (cron-job.org) / manual
    inputs:
      force:
        description: "Run even outside the ET market window"
        type: boolean
        default: false
      light:
        description: "Tiles-only refresh (indices/metals/crypto/FX) — preserves the last Tradier scan"
        type: boolean
        default: false

permissions:
  contents: write                   # allow the bot to push the refreshed JSON

concurrency:
  group: optionintel-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 13          # fits the engine-step retry: up to 2 attempts × 330s + a 60s cooloff
    env:
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      TRADIER_ENV:   ${{ secrets.TRADIER_ENV }}
      # Lets the scan fold registered users' private watchlist tickers in (build_json._user_tickers).
      # Absent → the read no-ops and only the default watchlist is scanned; the build never breaks.
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Single source of truth for WHEN the heartbeat runs. Uses America/New_York, so every window
      # below tracks EDT/EST automatically. A code push always runs (fresh deploy); a manual/external
      # dispatch can force off-window.
      #   • Weekdays: every ~10 min, 04:00–20:00 ET (premarket → post-market).
      #   • Sundays:  two short bands only — ~02:00–02:29 ET (just after ForexFactory's weekly econ
      #     calendar rolls to the new week, which happens ~00:00 ET Sun) and ~18:00–18:29 ET (a late
      #     weekend crypto snapshot as CME futures reopen). The */10 schedule already fires Sundays;
      #     these bands are the only weekend slots the gate lets through. Runs are idempotent, so the
      #     2–3 fires inside each band simply re-publish the same JSON — insurance against GitHub
      #     dropping a weekend cron tick.
      - id: gate
        name: Decide whether to run, and in which mode (DST-aware ET gate)
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
          LIGHT: ${{ github.event.inputs.light }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          ev    = os.environ.get("EVENT", "")
          force = (os.environ.get("FORCE") or "").lower() == "true"
          light = (os.environ.get("LIGHT") or "").lower() == "true"
          now   = datetime.now(ZoneInfo("America/New_York"))
          mins  = now.hour * 60 + now.minute
          wd    = now.weekday()                                         # Mon=0 … Sun=6
          weekday_win = (wd < 5) and (4*60) <= mins <= (20*60)          # 04:00–20:00 ET, Mon–Fri (pre→post-market)
          sunday_win  = (wd == 6) and (                                 # Sunday calendar-flip + crypto bands (ET)
              (2*60)  <= mins <= (2*60 + 29) or                         #   02:00–02:29 ET — after the econ-calendar roll
              (18*60) <= mins <= (18*60 + 29))                          #   18:00–18:29 ET — weekend crypto snapshot
          in_full = weekday_win or sunday_win                           # when the FULL Tradier scan runs
          # Mode:
          #   • code push               → full (fresh deploy)
          #   • explicit light dispatch → light, but ONLY off-hours (in-hours the full scan covers tiles)
          #   • force                   → full (off-window allowed)
          #   • inside the full window  → full (market-hours Tradier scan)
          #   • otherwise (off-hours)   → LIGHT: refresh only the 24/7 tiles (indices/metals/crypto/FX),
          #                               preserving the last full scan's signals so the Signals tab
          #                               still shows the last market-hours read to plan the open.
          if ev == "push":
              go, mode = True, "full"
          elif light:
              go, mode = (not in_full), "light"
          elif force:
              go, mode = True, "full"
          elif in_full:
              go, mode = True, "full"
          else:
              go, mode = True, "light"
          print(f"{now:%a %Y-%m-%d %H:%M} ET | in_full={in_full} event={ev} force={force} light={light} "
                f"-> go={go} mode={mode}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"go={'true' if go else 'false'}\n")
              f.write(f"mode={mode}\n")
          PY

      - name: Install engine deps
        if: steps.gate.outputs.go == 'true'
        run: pip install requests yfinance

      - name: Run engine → JSON (retry on hang/failure, 60s cooloff)
        if: steps.gate.outputs.go == 'true'
        id: engine
        run: |
          set +e
          run_engine() {
            if [ "${{ steps.gate.outputs.mode }}" = "light" ]; then
              echo "LIGHT refresh — tiles only; keeping the last full Tradier scan."
              # Seed the base from the freshest published scan (the data branch), then merge tiles into it.
              git fetch --depth=1 origin data
              git cat-file -p FETCH_HEAD:signals.json > site/data/signals.json
              timeout --signal=SIGKILL 330s python build_json.py --light
            else
              timeout --signal=SIGKILL 330s python build_json.py
            fi
          }
          # Fallback for a hung/failed run: retry once after a 60s cooloff, each attempt capped at 330s
          # so one stuck upstream fetch can't burn the whole budget and leave the site stale at the open
          # (2026-11-17 incident). First success publishes (published=true → guard/publish run).
          #
          # Exit-code contract from build_json.py's deadline watchdog:
          #   0  → published a fresh (or core-only) scan this cycle
          #   75 → EX_TEMPFAIL: upstream too slow, DELIBERATELY kept last-good (designed degradation)
          #   other → a genuine crash/hang
          # rc=75 is NOT a failure: the site keeps serving honestly-timestamped last-good data, so it
          # must not email "all jobs failed" — it only annotates. Any other non-zero fails the job loudly.
          published=false
          for attempt in 1 2; do
            echo "::group::engine attempt ${attempt}/2 (mode=${{ steps.gate.outputs.mode }})"
            run_engine; rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then echo "engine OK on attempt ${attempt}"; published=true; break; fi
            if [ $rc -eq 75 ]; then
              echo "::warning::engine attempt ${attempt}: upstream too slow to finish the core scan in time — kept last-good data (degraded cycle, not a failure)"
            else
              echo "::warning::engine attempt ${attempt} failed (rc=${rc})"
            fi
            if [ $attempt -lt 2 ]; then echo "60s cooloff, then retry…"; sleep 60; fi
          done
          echo "published=${published}" >> "$GITHUB_OUTPUT"
          if [ "$published" = "true" ]; then exit 0; fi
          # Both attempts non-publishing. The expected degraded fail-safe (last attempt rc=75) keeps the
          # job green; any other code is a real error.
          if [ $rc -eq 75 ]; then
            echo "::warning::Kept last-good data after 2 degraded attempts (upstream slow). Site still serves the last good scan; not failing the job."
            exit 0
          fi
          echo "::error::engine failed after 2 attempts (rc=${rc})"; exit 1

      - name: Guard — never publish a degenerate full scan
        if: steps.gate.outputs.go == 'true' && steps.engine.outputs.published == 'true'
        id: guard
        env:
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          mode = os.environ.get("MODE", "full")
          new  = json.load(open("site/data/signals.json"))
          n_ov, n_sig = len(new.get("overview", []) or []), len(new.get("signals", []) or [])
          if mode == "light":
              # Tradier data is preserved from the base; tiles may blank (honest) but never degrade.
              ok, why = True, "light refresh (Tradier data preserved)"
          else:
              base_ov = None
              try:
                  with urllib.request.urlopen(
                      "https://raw.githubusercontent.com/cybercurry/options-dashboard/data/signals.json",
                      timeout=20) as r:
                      base_ov = len((json.load(r).get("overview", []) or []))
              except Exception as e:
                  print("base unreachable (treat as first publish):", e)
              ok, why = True, "ok"
              if n_ov == 0:
                  ok, why = False, "overview EMPTY — refusing to blank the site"
              elif base_ov and n_ov < base_ov * 0.5:
                  ok, why = False, f"overview collapsed ({n_ov} vs last-good {base_ov}, <50%)"
          print(f"mode={mode} overview={n_ov} signals={n_sig} -> publish={ok} ({why})")
          if not ok:
              print(f"::warning::Refusing to publish — {why}. Keeping the last good data branch (its older timestamp stays visible).")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"publish={'true' if ok else 'false'}\n")
          PY

      - name: Publish data to the `data` branch (served to the site; keeps main small)
        if: steps.gate.outputs.go == 'true' && steps.engine.outputs.published == 'true' && steps.guard.outputs.publish == 'true'
        run: |
          git config user.name  "optionintel-bot"
          git config user.email "optionintel-bot@users.noreply.github.com"
          # Publish signals.json as a ONE-FILE, PARENT-LESS commit forced onto the `data` branch.
          # No parent → the branch never accumulates history (old blobs get GC'd), so even a 10-min
          # cadence never bloats the repo. Cloudflare Pages watches `main`, so this NEVER triggers a
          # site rebuild — data refresh is fully decoupled from the 500-build/month cap. The page
          # fetches this file from raw.githubusercontent (…/data/signals.json) and falls back to the
          # copy bundled in the last deploy if GitHub raw is briefly unreachable.
          blob=$(git hash-object -w site/data/signals.json)
          tree=$(printf '100644 blob %s\tsignals.json\n' "$blob" | git mktree)
          # "[skip ci]" tells Cloudflare Pages AND Workers Builds to ignore this commit — the data
          # branch has no site/Worker to build, so without it every refresh triggers a failed build.
          commit=$(git commit-tree "$tree" -m "data refresh $(date -u +%FT%TZ) [skip ci]")
          git push --force origin "$commit:refs/heads/data"
          echo "Published → https://raw.githubusercontent.com/cybercurry/options-dashboard/data/signals.json"
