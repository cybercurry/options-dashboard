name: Selftest fundamentals (PATH)

# Manual harness for the on-demand fundamentals function. Prints the Python ground truth (the
# proven fundamentals.py engine) for a ticker AND curls the deployed Cloudflare function, so the
# two can be compared. Read the logs to validate / iterate.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker to test"
        default: "PATH"
      seed_tickers:
        description: "Comma-separated tickers to insert into a user's watchlist (blank = skip)"
        default: ""
      seed_user:
        description: "user_id (uuid) to seed the tickers for"
        default: ""
      otp_email:
        description: "Email to send a real magic-link to (tests custom SMTP end-to-end; blank = skip)"
        default: ""
      feedback_test:
        description: "Set 'yes' to POST a real test feedback (sends one email to FEEDBACK_TO)"
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      TRADIER_ENV:   ${{ secrets.TRADIER_ENV }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TK: ${{ github.event.inputs.ticker }}
      SEED_TICKERS: ${{ github.event.inputs.seed_tickers }}
      SEED_USER:    ${{ github.event.inputs.seed_user }}
      OTP_EMAIL:    ${{ github.event.inputs.otp_email }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Feedback endpoint (route probe + optional real send)
        run: |
          echo "=== GET /api/feedback (route deployed?) ==="
          curl -s -o /tmp/fg -w "status %{http_code}\n" https://optionintel.app/api/feedback
          echo "body:"; cat /tmp/fg; echo
          if [ "${{ github.event.inputs.feedback_test }}" = "yes" ]; then
            echo "=== POST /api/feedback (real end-to-end send → FEEDBACK_TO) ==="
            curl -s -o /tmp/fp -w "status %{http_code}\n" -X POST https://optionintel.app/api/feedback \
              -H "Content-Type: application/json" \
              -d '{"category":"Bug","message":"CI end-to-end feedback test — please ignore.","email":"cybercurry@runbox.com","page":"#overview"}'
            echo "body:"; cat /tmp/fp; echo
            echo "200 {ok:true} = configured + sent · 500 = env vars not set · 502 = Resend send failed"
          fi

      - name: Verify the LIVE site serves the latest code (proves repo → deploy path)
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /tmp/site -w "%{http_code}" https://optionintel.app/ || echo 000)
            echo "attempt $i -> $code"; [ "$code" = "200" ] && break; sleep 15
          done
          echo "--- build stamp on live site ---"
          grep -o 'id="buildid">[^<]*' /tmp/site || echo "buildid NOT FOUND"
          echo "--- auth flowType on live site ---"
          grep -o "flowType:'[a-z]*'" /tmp/site || echo "flowType NOT FOUND"
          echo "--- diagnostic snapshot present? ---"
          grep -c "__AUTHSNAP" /tmp/site || true

      - name: Send a real magic link (end-to-end custom-SMTP test)
        if: ${{ github.event.inputs.otp_email != '' }}
        run: |
          python - <<'PY'
          import os, requests
          url = "https://asxwbjrripzbkcxbkect.supabase.co"
          # public anon key (same one embedded in the site; safe to use here)
          anon = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzeHdianJyaXB6YmtjeGJrZWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQ5OTgsImV4cCI6MjEwMzU5MDk5OH0.Uq8Fi9eH14CUC9dt2oB6OFVTH3tNdzanN9rKRNVcB4k"
          email = os.environ["OTP_EMAIL"].strip()
          r = requests.post(url + "/auth/v1/otp",
                            params={"redirect_to": "https://optionintel.app"},
                            json={"email": email, "create_user": True},
                            headers={"apikey": anon, "Content-Type": "application/json"},
                            timeout=20)
          print("OTP send status:", r.status_code)
          print("body:", r.text[:400])
          if r.status_code == 200:
              print("RESULT: OK — Supabase accepted the send (custom SMTP working, no rate-limit block).")
          elif r.status_code == 429:
              print("RESULT: RATE-LIMITED — the email rate limit is still low or not saved.")
          else:
              print("RESULT: ERROR — likely SMTP misconfig; read the body above.")
          PY

      - name: Seed watchlist rows (owner test — proves DB write + fold path)
        if: ${{ github.event.inputs.seed_tickers != '' }}
        run: |
          python - <<'PY'
          import os, requests
          key = (os.environ.get("SUPABASE_SERVICE_KEY") or "").strip()
          url = "https://asxwbjrripzbkcxbkect.supabase.co"
          user = (os.environ.get("SEED_USER") or "").strip()
          tickers = [t.strip().upper() for t in (os.environ.get("SEED_TICKERS") or "").split(",") if t.strip()]
          if not (key and user and tickers):
              print("seed skipped — missing key/user/tickers"); raise SystemExit(0)
          rows = [{"user_id": user, "ticker": t} for t in tickers]
          r = requests.post(url + "/rest/v1/watchlist", json=rows,
                            headers={"apikey": key, "Authorization": "Bearer " + key,
                                     "Content-Type": "application/json",
                                     "Prefer": "resolution=ignore-duplicates,return=representation"},
                            timeout=15)
          print("INSERT status:", r.status_code, r.text[:300])
          # Read the row set back (service_role bypasses RLS) to confirm what's stored now.
          g = requests.get(url + "/rest/v1/watchlist", params={"select": "ticker,user_id"},
                          headers={"apikey": key, "Authorization": "Bearer " + key}, timeout=15)
          print("WATCHLIST now:", g.status_code, g.text[:500])
          PY

      - name: Supabase service-key read (folds users' watchlists into the scan)
        run: |
          python - <<'PY'
          import os, requests, build_json
          key = (os.environ.get("SUPABASE_SERVICE_KEY") or "").strip()   # tolerate a pasted trailing newline
          url = "https://asxwbjrripzbkcxbkect.supabase.co"
          print("SERVICE_KEY present:", bool(key))
          # (a) The engine's own read — deduped union of every user's private tickers.
          tk = build_json._user_tickers()
          print("USER_TICKERS count:", len(tk))
          print("USER_TICKERS sample:", tk[:20])   # symbols only — never prints the key
          # (b) Prove the key is genuinely the service_role: hit the admin endpoint that ONLY it can
          #     reach. 200 => valid + RLS-bypassing (so an empty watchlist really is empty). 401/403
          #     => wrong key. Prints the registered-user COUNT only (no emails into the CI log).
          try:
              r = requests.get(url + "/auth/v1/admin/users",
                               headers={"apikey": key, "Authorization": "Bearer " + key},
                               timeout=15)
              n = None
              try:
                  j = r.json(); n = len(j.get("users", j) if isinstance(j, dict) else j)
              except Exception:
                  pass
              print("ADMIN /users status:", r.status_code, "-> service_role VALID" if r.status_code==200 else "-> NOT service_role")
              print("REGISTERED_USERS count:", n)
          except Exception as e:
              print("ADMIN probe error:", type(e).__name__, e)
          PY

      - name: Python ground truth (the proven engine)
        run: |
          python - <<'PY'
          import json, os, fundamentals, tradier
          tk = os.environ.get("TK") or "PATH"
          price = None
          try:
              if tradier.is_configured():
                  q = tradier.get_quotes([tk]); price = (q[0].get("last") if q else None)
          except Exception as e:
              print("price err:", e)
          print("TICKER", tk, "PRICE", price)
          res = fundamentals.analyze(tk, price)
          slim = {k: res.get(k) for k in ("ok", "company", "cik", "groups", "metrics", "flags")}
          print("GROUND_TRUTH", json.dumps(slim, default=str))
          PY

      - name: Curl the deployed Cloudflare function
        run: |
          echo "=== /api/ping ==="
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /tmp/ping -w "%{http_code}" https://optionintel.app/api/ping || echo 000)
            echo "attempt $i -> $code"; [ "$code" = "200" ] && break; sleep 20
          done
          echo "--- body ---"; cat /tmp/ping; echo
          echo "=== /api/fundamentals?t=$TK ==="
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /tmp/f -w "%{http_code}" "https://optionintel.app/api/fundamentals?t=$TK" || echo 000)
            echo "attempt $i -> $code"; [ "$code" = "200" ] && break; sleep 20
          done
          echo "--- body (first 4000 chars) ---"; head -c 4000 /tmp/f; echo

      - name: Supabase connectivity (public anon key)
        run: |
          URL="https://asxwbjrripzbkcxbkect.supabase.co"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzeHdianJyaXB6YmtjeGJrZWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQ5OTgsImV4cCI6MjEwMzU5MDk5OH0.Uq8Fi9eH14CUC9dt2oB6OFVTH3tNdzanN9rKRNVcB4k"
          echo "=== REST: watchlist table (RLS, no user → [] if table exists) ==="
          curl -s -o /tmp/sb -w "status %{http_code}\n" "$URL/rest/v1/watchlist?select=ticker&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo "body:"; cat /tmp/sb; echo
          echo "=== Auth settings (is the project reachable / email enabled?) ==="
          curl -s -o /tmp/sba -w "status %{http_code}\n" "$URL/auth/v1/settings" -H "apikey: $KEY"
          echo "body (first 500):"; head -c 500 /tmp/sba; echo
