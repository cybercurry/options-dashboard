name = "optionintel-refresh-scheduler"
main = "refresh-scheduler.js"
compatibility_date = "2026-09-01"

# Every 10 min, all hours. The Worker code (inEtWindow) refines this to 04:00–20:00 ET, Mon–Fri
# (premarket → post-market) with DST handling, so off-window / weekend ticks simply no-op.
# This file is the source of truth for the cron — `wrangler deploy` overwrites the dashboard value.
[triggers]
crons = ["*/10 * * * *"]

# GH_TOKEN and REFRESH_KEY are secrets — set them with `wrangler secret put …` or in the dashboard,
# never in this file.
